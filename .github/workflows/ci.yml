name: CI — site build verification

# PR 质量门：只做构建校验，不部署。质量门不绿不得合并。
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Type & diagnostics check (astro check)
        working-directory: site
        run: npm run check

      - name: Format check (prettier)
        working-directory: site
        run: npm run format:check

      - name: Build
        working-directory: site
        run: npm run build

      - name: Check links & base path
        working-directory: site
        run: npm run check:links
